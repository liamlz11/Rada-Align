[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rada-align"
version = "0.0.1"
description = "Autonomous horn-to-radar alignment (DRS RADA hackathon)"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "pyyaml",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["rada_align*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
