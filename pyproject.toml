[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rada-align"
version = "0.0.1"
description = "Autonomous horn-to-radar alignment (DRS RADA hackathon)"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "pyyaml",
    "fastapi",
    "uvicorn",
    "websockets",  # WebSocket support for uvicorn
    "opencv-python",
]

[project.optional-dependencies]
dev = ["pytest", "httpx"]  # httpx: FastAPI TestClient

[tool.setuptools.packages.find]
include = ["rada_align*"]

[tool.setuptools.package-data]
"rada_align.ui" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
