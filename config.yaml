# rada_align configuration.
#
# RULE: every component parameter is marked
#   "ASSUMPTION - replace with datasheet/measurement"
# until it is replaced by a real value, which is then marked with its source.
# No assumed value may be presented as a real spec.
# Values marked DESIGN are controller design choices, fixed before any
# simulation result was seen. They are never tuned to make a test pass.

mode: sim  # sim | hw

# Radar (mentor, 2026-11-16): 35 kg, 4-8 GHz, aligned once before the test and
# static during it; the system aligns it by moving the horn. The +/-1 deg
# manual setup error below is still our ASSUMPTION (OPEN_QUESTIONS Q19).
geometry:
  distance_m: 12.0                # ASSUMPTION - replace with datasheet/measurement (challenge: 10-15 m)
  tolerance_deg: 0.05              # REQUIREMENT R7
  initial_pointing_error_deg: 1.0  # ASSUMPTION - replace with datasheet/measurement (manual setup, uniform +/- per axis, radar and horn)
  initial_roll_deg: 0.5            # ASSUMPTION - replace with datasheet/measurement (spirit-level setup, uniform +/-)
  # Pan/tilt pivot -> horn aperture center, horn body frame [right, forward, up]
  horn_pivot_to_center_m: [0.0, 0.10, 0.0]  # ASSUMPTION - replace with datasheet/measurement

# Offsets are [right, up] in the head's own body frame, from its reference
# point (radar: mechanical reference axis; horn: aperture center).
#
# RIG RULE (decided 2026-11-14): matched offsets. Each beacon sits at the
# mirror position of the opposite camera (beacon right = -camera right, same
# height), so the parallax baseline is ~0 and a range error no longer costs
# angle. The real rig must be built this way; any mismatch goes in here.
radar_head:
  camera_offset_m: [0.10, 0.0]     # ASSUMPTION - replace with datasheet/measurement (CHALLENGE.md example: 10 cm)
  beacon_offset_m: [-0.10, 0.0]    # ASSUMPTION - replace with datasheet/measurement (mirrors the horn camera)
horn_head:
  camera_offset_m: [0.10, 0.0]     # ASSUMPTION - replace with datasheet/measurement
  beacon_offset_m: [-0.10, 0.0]    # ASSUMPTION - replace with datasheet/measurement (mirrors the radar camera)

camera:  # same model on both heads
  focal_length_mm: 25.0            # ASSUMPTION - replace with datasheet/measurement (CHALLENGE.md)
  pixel_size_um: 1.55              # ASSUMPTION - replace with datasheet/measurement (CHALLENGE.md)
  width_px: 4056                   # ASSUMPTION - replace with datasheet/measurement (Pi HQ camera class)
  height_px: 3040                  # ASSUMPTION - replace with datasheet/measurement
  rate_hz: 10.0                    # ASSUMPTION - replace with datasheet/measurement (centroid output rate)
  centroid_noise_px: 0.3           # ASSUMPTION - replace with datasheet/measurement (per sample, white; ~0.001 deg)
  turbulence_deg: 0.003            # ASSUMPTION - replace with datasheet/measurement (budget row, apparent beacon wander)
  turbulence_tau_s: 0.5            # ASSUMPTION - replace with datasheet/measurement

vision:  # real camera pipeline (rada_align/vision); not used by the simulator
  device_index: 0                  # ASSUMPTION - replace with datasheet/measurement (which camera Windows lists first)
  exposure: -6.0                   # ASSUMPTION - replace with datasheet/measurement (driver units; fixed, auto exposure off)
  saturation_level: 250.0          # DESIGN: 8-bit pixels at or above this are treated as saturated
  threshold_sigma: 6.0             # DESIGN: blob pixels must exceed background by this many noise sigmas
  min_contrast: 15.0               # DESIGN: ... and by at least this many grey levels
  min_area_px: 6                   # DESIGN: smaller blobs are noise
  max_area_px: 4000                # DESIGN: larger blobs are not a beacon
  min_circularity: 0.6             # DESIGN: minor/major axis of the blob's intensity ellipse
  roi_half_px: 80                  # DESIGN: search window around the last position (0 = whole frame)
  sigma_window: 20                 # DESIGN: samples used for the reported centroid sigma
  frame_differencing: 0            # DESIGN: 1 = LED on minus LED off (needs LED control)

calibration:
  mount_misalignment_deg: 0.5      # ASSUMPTION - replace with datasheet/measurement (true camera-to-axis delta, uniform +/-)
  residual_sigma_deg: 0.015        # ASSUMPTION - replace with datasheet/measurement (budget row; bias per setup, both heads)
  fixture_repeat_sigma_deg: 0.010  # ASSUMPTION - replace with datasheet/measurement (budget row; bias per setup, radar head)

inclinometer:
  noise_deg: 0.005                 # ASSUMPTION - replace with datasheet/measurement (budget row, per sample)
  bias_sigma_deg: 0.005            # ASSUMPTION - replace with datasheet/measurement (bias per setup)

rangefinder:
  bias_sigma_m: 0.05               # ASSUMPTION - replace with datasheet/measurement (CHALLENGE.md: +/-5 cm)
  noise_m: 0.01                    # ASSUMPTION - replace with datasheet/measurement (per sample)

# Travel: +/-250 mm covers 1.19 deg at 12 m and 0.95 deg at 15 m; the field
# mount needs about +/-400 mm (docs/TASKS.md task 3). Kept at 250 here to match
# the 2 m demo rig and firmware/include/config.h.
actuators:  # x, z in mm; pan, tilt in deg; max_speed per second
  x:    {step: 0.0025,   backlash: 0.05, max_speed: 20.0, min: -250.0, max: 250.0}  # ASSUMPTION - replace with datasheet/measurement (8 mm lead screw, 200 x 16 microsteps)
  z:    {step: 0.0025,   backlash: 0.05, max_speed: 20.0, min: -250.0, max: 250.0}  # ASSUMPTION - replace with datasheet/measurement
  pan:  {step: 0.001125, backlash: 0.02, max_speed: 2.0,  min: -15.0,  max: 15.0}   # ASSUMPTION - replace with datasheet/measurement (1.8 deg / 16 / 100 worm gear)
  tilt: {step: 0.001125, backlash: 0.02, max_speed: 2.0,  min: -15.0,  max: 15.0}   # ASSUMPTION - replace with datasheet/measurement

hw:  # ESP32 horn mount (rada_align/hw); not used by the simulator
  serial_port: COM3                # ASSUMPTION - replace with datasheet/measurement (Device Manager > Ports)
  baud: 115200                     # must match SERIAL_BAUD in firmware/include/config.h
  timeout_s: 0.5                   # DESIGN: reply timeout per command
  ping_interval_s: 0.3             # DESIGN: keep-alive period (firmware watchdog is 1 s)
  # +1 or -1 per axis [x, z, pan, tilt]: flips an axis whose motor is wired the other way
  direction: [1, 1, 1, 1]          # ASSUMPTION - replace with datasheet/measurement (set on the bench)

disturbances:  # angular motion of each tripod head, per axis
  # jitter and sway RSS to the 0.015 deg "wind and tripod settling" budget row
  wind_jitter_deg: 0.0106          # ASSUMPTION - replace with datasheet/measurement (white, per sample)
  wind_sway_deg: 0.0106            # ASSUMPTION - replace with datasheet/measurement (low-frequency, 1 sigma)
  wind_sway_tau_s: 2.0             # ASSUMPTION - replace with datasheet/measurement
  drift_rate_sigma_deg_per_min: 0.01  # ASSUMPTION - replace with datasheet/measurement (slow tripod settling)

estimator:
  align_window_s: 1.0              # DESIGN: quick look while errors are larger than the tolerance
  verify_window_s: 5.0             # DESIGN: pass-criterion window (CLAUDE.md: 5-10 s)
  settle_time_s: 0.5               # DESIGN: wait after motion before sampling

controller:
  deadband_deg: 0.01               # DESIGN: no fine correction below this
  gain: 1.0                        # DESIGN
  max_iterations: 30               # DESIGN: coarse corrections before FAULT
  max_verify_attempts: 6           # DESIGN: verify windows before FAULT
  coarse_threshold_deg: 0.03       # DESIGN: coarse ALIGN corrects errors above this; VERIFY trims the rest
  track_drift_threshold_deg: 0.03  # DESIGN (CHALLENGE.md operating flow, step 8): TRACK re-aligns when |mean| exceeds this
  acquire_frames: 5                # DESIGN: consecutive valid frames on both cameras
  acquire_timeout_s: 60.0          # DESIGN
  lost_frames: 10                  # DESIGN: consecutive invalid frames before re-acquiring
  unstable_windows: 3              # DESIGN: consecutive align windows with 2*sigma >= tolerance before FAULT
  search_step_deg: 5.0             # DESIGN: spiral search step (about half the smaller FOV)
  search_max_deg: 10.0             # DESIGN
  search_dwell_s: 0.5              # DESIGN

montecarlo:
  runs: 500
  seed: 0
  max_time_s: 300.0
  track_time_s: 10.0
  sensitivity_runs: 100

# ---------------------------------------------------------------------------
# FINAL DESIGN (docs/FINAL_DESIGN.md): Raster Scan + PSD + KLT.
# Used only by rada_align.psd (the final-design simulator and demo). Every
# section above belongs to the superseded mutual-sighting code.
psd:
  geometry:
    horn_lever_m: [0.10, 0.0, 0.0]     # [repo] geometry.horn_pivot_to_center_m: pivot -> horn centre, body [fwd, left, up]
    radar_lever_m: [0.10, 0.0, 0.30]   # ASSUMPTION - replace with datasheet/measurement (radar reference vs its tilt pivot)
    laser_a_m: [-0.15, 0.10]           # ASSUMPTION - replace with datasheet/measurement (horn body [left, up]); PSD-A at the mirror position
    laser_b_m: [0.15, 0.10]            # ASSUMPTION - replace with datasheet/measurement
    laser_c_m: [0.0, -0.10]            # ASSUMPTION - replace with datasheet/measurement
    setup_pointing_deg: 1.0            # ASSUMPTION - replace with datasheet/measurement (manual setup, uniform +/- per servo axis)
    setup_roll_deg: 0.5                # ASSUMPTION - replace with datasheet/measurement
    setup_offset_m: 0.25               # ASSUMPTION - replace with datasheet/measurement (relative horn position, uniform +/-, field)
    setup_offset_short_m: 0.05         # ASSUMPTION - replace with datasheet/measurement (same, tabletop, used when d <= 3 m)
  sensor:
    ac_size_mm: 20.0                   # ASSUMPTION - replace with datasheet/measurement (field option, OSI DL-20 class [vendor page]; S5991-01 is 9)
    b_size_mm: 9.0                     # [datasheet] Hamamatsu S5991-01 photosensitive area 9 x 9 mm
    b_focal_mm: 50.0                   # ASSUMPTION - replace with datasheet/measurement (PSD-B lens)
    b_aperture_mm: 25.0                # ASSUMPTION - replace with datasheet/measurement (PSD-B lens clear aperture)
    noise_um: 1.5                      # [datasheet] S5991-01 position resolution at 1 uA, 1 kHz (conservative here)
    rate_hz: 100.0                     # ASSUMPTION - replace with datasheet/measurement (lock-in output rate used by the simulator)
  laser:
    wavelength_nm: 960.0               # DESIGN (D11): PSD peak sensitivity [datasheet]
    launch_radius_mm: 5.0              # DESIGN (FINAL_DESIGN 7.1): 10 mm beam focused at the PSD distance
    board_sigma_deg: 0.010             # ASSUMPTION - replace with datasheet/measurement (board to horn axis after CALIB, common mode)
    differential_sigma_deg: 0.005      # ASSUMPTION - replace with datasheet/measurement (laser to laser)
  calib:
    psd_b_null_sigma_deg: 0.015        # ASSUMPTION - replace with datasheet/measurement (PSD-B null to radar datum)
    seat_sigma_deg: 0.010              # ASSUMPTION - replace with datasheet/measurement (PSD unit seat on the datum, per setup)
    psd_position_sigma_mm: 0.5         # ASSUMPTION - replace with datasheet/measurement (PSD-A/C vs radar reference)
  servos:
    travel_deg: 5.0                    # DESIGN (FINAL_DESIGN section 2): +/- on every axis
    max_speed_deg_s: 2.0               # ASSUMPTION - replace with datasheet/measurement
    encoder_deg: 0.001                 # DESIGN (FINAL_DESIGN 7.5): output resolution per count
  wind:
    jitter_deg: 0.0106                 # ASSUMPTION - replace with datasheet/measurement (per head, per axis, fast part)
    jitter_tau_s: 0.05                 # ASSUMPTION - replace with datasheet/measurement
    sway_deg: 0.0106                   # ASSUMPTION - replace with datasheet/measurement (per head, per axis, slow part)
    sway_tau_s: 2.0                    # ASSUMPTION - replace with datasheet/measurement
    drift_deg_per_min: 0.01            # ASSUMPTION - replace with datasheet/measurement (slow settling, 1 sigma rate)
  inclinometer:
    noise_deg: 0.002                   # ASSUMPTION - replace with datasheet/measurement
    bias_sigma_deg: 0.005              # ASSUMPTION - replace with datasheet/measurement
  camera:
    acquire_sigma_deg: 0.05            # ASSUMPTION - replace with datasheet/measurement (camera-to-laser-board boresight, per setup)
    fov_half_deg: 7.0                  # ASSUMPTION - replace with datasheet/measurement
  rangefinder:
    sigma_m: 0.05                      # ASSUMPTION - replace with datasheet/measurement
  control:
    deadband_deg: 0.01                 # DESIGN
    kp: 1.0                            # DESIGN: ALIGN gain on the decoupled errors
    ki: 0.0                            # DESIGN
    track_kp: 0.5                      # DESIGN: TRACK horn gain
    settle_s: 0.3                      # DESIGN
    align_window_s: 0.5                # DESIGN
    verify_window_s: 5.0               # DESIGN (CLAUDE.md: 5-10 s)
    track_window_s: 5.0                # DESIGN
    track_threshold_deg: 0.03          # DESIGN (CHALLENGE.md operating flow step 8)
    radar_alert_deg: 0.03              # DESIGN (FINAL_DESIGN C1)
    max_iterations: 20                 # DESIGN
    max_verify_attempts: 4             # DESIGN
    min_valid_fraction: 0.9            # DESIGN: VERIFY fails if fewer samples have the spot fully on the PSD
    scan_sigmas: 3.0                   # DESIGN: raster half-window = scan_sigmas * camera.acquire_sigma_deg
    beam_lost_s: 1.0                   # DESIGN: longer beam loss in TRACK -> SCAN (shorter: KLT bridge)
